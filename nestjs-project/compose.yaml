services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm ci && npm run start:dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: streamtube
      DB_PASSWORD: streamtube
      DB_NAME: streamtube
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-development
      JWT_REFRESH_SECRET: change-me-refresh-in-development
      APP_URL: http://localhost:3000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: '"StreamTube" <noreply@streamtube.com>'
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_ORIGINALS: videos-originals
      S3_BUCKET_PUBLIC: videos-public
      S3_MULTIPART_PART_SIZE_BYTES: 8388608
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/status >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: sh -c "npm ci && npm run start:worker:dev"
    ports:
      - '3001:3001'
    volumes:
      - .:/home/node/app
      - worker_node_modules:/home/node/app/node_modules
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: streamtube
      DB_PASSWORD: streamtube
      DB_NAME: streamtube
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-development
      JWT_REFRESH_SECRET: change-me-refresh-in-development
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: '"StreamTube" <noreply@streamtube.com>'
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_ORIGINALS: videos-originals
      S3_BUCKET_PUBLIC: videos-public
      S3_MULTIPART_PART_SIZE_BYTES: 8388608
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3001/status >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  db:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamtube']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:9000/minio/health/live >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  worker_node_modules:
  redis_data:
  minio_data:
